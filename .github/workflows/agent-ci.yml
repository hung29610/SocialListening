name: Blocking CI

on:
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2 # 7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run maintained backend suite
        env:
          TEST_REDIS_URL: redis://localhost:6379/15
        run: python -m pytest

  pipeline-redelivery:
    name: Pipeline PostgreSQL + Redis redelivery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_DB: issue220_pipeline
          POSTGRES_USER: issue220
          POSTGRES_PASSWORD: issue220-isolated-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U issue220 -d issue220_pipeline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2 # 7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Prove real queue delivery and worker-loss redelivery
        env:
          TEST_DATABASE_URL: postgresql://issue220:issue220-isolated-ci@localhost:5432/issue220_pipeline
          TEST_REDIS_URL: redis://localhost:6379/15
        run: |
          # Historical fresh-database migrations are tracked separately in #178/#189.
          # Build the exact pre-Wave-1A table surface, stamp its known head, and
          # rehearse only this new revision without editing historical files.
          TEST_DATABASE_URL="$TEST_DATABASE_URL" python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["TEST_DATABASE_URL"])
          existing = {
              "source_items": (),
              "crawl_jobs": ("user_id",),
              "scan_schedules": ("user_id",),
              "discovery_jobs": ("project_id", "created_by_user_id"),
              "discovered_sources": ("project_id",),
              "blocked_domains": ("project_id", "blocked_by_user_id"),
              "report_exports": ("project_id", "requested_by"),
          }
          with engine.begin() as connection:
              for table, columns in existing.items():
                  column_sql = "".join(f", {column} INTEGER" for column in columns)
                  connection.execute(text(f"CREATE TABLE {table} (id SERIAL PRIMARY KEY{column_sql})"))
              connection.execute(text(
                  "CREATE TABLE mentions ("
                  "id SERIAL PRIMARY KEY, organization_id INTEGER, "
                  "project_id INTEGER, keyword_id INTEGER, collected_at TIMESTAMPTZ)"
              ))
          engine.dispose()
          PY
          DATABASE_URL="$TEST_DATABASE_URL" python -m alembic stamp 7c2e4d6b8a91
          DATABASE_URL="$TEST_DATABASE_URL" python -m alembic upgrade head
          test "$(python -m alembic heads | awk '{print $1}')" = "$(DATABASE_URL="$TEST_DATABASE_URL" python -m alembic current | awk '{print $1}')"
          DATABASE_URL="$TEST_DATABASE_URL" python -m alembic downgrade -1
          DATABASE_URL="$TEST_DATABASE_URL" python -m alembic upgrade head
          TEST_DATABASE_URL="$TEST_DATABASE_URL" python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["TEST_DATABASE_URL"])
          with engine.begin() as connection:
              connection.execute(text("DROP SCHEMA public CASCADE"))
              connection.execute(text("CREATE SCHEMA public"))
          engine.dispose()
          PY
          python -m pytest tests/test_pipeline_pg_redis_integration.py \
            -q -rs --junitxml="${RUNNER_TEMP}/pipeline-redelivery.xml"
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("${{ runner.temp }}/pipeline-redelivery.xml")
          root = ET.parse(report).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          totals = {
              key: sum(int(suite.attrib.get(key, 0)) for suite in suites)
              for key in ("tests", "failures", "errors", "skipped")
          }
          assert totals == {
              "tests": 3,
              "failures": 0,
              "errors": 0,
              "skipped": 0,
          }, f"pipeline integration gate did not run exactly three passing tests: {totals}"
          print(f"pipeline integration gate: {totals}")
          PY
          TEST_DATABASE_URL="$TEST_DATABASE_URL" python -m pytest \
            tests/test_mentions_feed_postgres.py -q -rs \
            --junitxml="${RUNNER_TEMP}/mention-performance-postgres.xml"
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("${{ runner.temp }}/mention-performance-postgres.xml")
          root = ET.parse(report).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          totals = {
              key: sum(int(suite.attrib.get(key, 0)) for suite in suites)
              for key in ("tests", "failures", "errors", "skipped")
          }
          assert totals == {
              "tests": 2,
              "failures": 0,
              "errors": 0,
              "skipped": 0,
          }, f"mention PostgreSQL benchmark gate did not run exactly two passing tests: {totals}"
          print(f"mention PostgreSQL benchmark gate: {totals}")
          PY
          DATABASE_URL="$TEST_DATABASE_URL" python -m app.scripts.audit_tenant_integrity

  frontend:
    name: Frontend checks (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit
      - name: Type-check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: I18n and static product contracts
        run: npm run check-i18n-all
      - name: Production build
        run: npm run build

  cors-preflight-smoke:
    name: CORS preflight smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install smoke dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          npm ci --no-audit
      - name: Start isolated API
        env:
          DATABASE_URL: sqlite:///./cors-smoke.db
          ENVIRONMENT: production
          FRONTEND_URL: https://social-listening-azure.vercel.app
          REDIS_ENABLED: "false"
          RUN_MIGRATIONS_ON_STARTUP: "false"
          SCHEDULER_ENABLED: "false"
          SECRET_KEY: ci-only-cors-smoke-key
        run: |
          cd backend
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 >"${RUNNER_TEMP}/cors-api.log" 2>&1 &
          echo $! >"${RUNNER_TEMP}/cors-api.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/cors-api.log"
          exit 1
      - name: Verify configured API preflight with Playwright
        env:
          PLAYWRIGHT_API_BASE_URL: http://127.0.0.1:8000
          PLAYWRIGHT_APP_ORIGIN: https://social-listening-azure.vercel.app
        run: npx playwright test tests/api_cors_preflight.spec.ts --project=chromium

  authenticated-playwright:
    name: Authenticated Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_DB: wave2c_e2e
          POSTGRES_USER: wave2c
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wave2c -d wave2c_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2 # 7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_USER: wave2c
      POSTGRES_DB: wave2c_e2e
      REDIS_URL: redis://127.0.0.1:6379/14
      TEST_REDIS_URL: redis://127.0.0.1:6379/14
      E2E_REDIS_PREFIX: nope360:e2e:${{ github.run_id }}:${{ github.run_attempt }}
      E2E_API_BASE_URL: http://127.0.0.1:8010
      ENVIRONMENT: test
      RUN_MIGRATIONS_ON_STARTUP: "false"
      ENABLE_EMBEDDED_SCHEDULER: "false"
      SCHEDULER_ENABLED: "false"
      AUTO_DISCOVERY_ENABLED: "false"
      SOCIAL_CRAWL_ENABLED: "false"
      SEARCH_PROVIDER_ORDER: rss
      REDIS_ENABLED: "true"
      TENANT_INTEGRITY_REQUIRE_READY: "true"
      FRONTEND_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Generate isolated fixture credentials
        shell: bash
        run: |
          db_url='postgresql:'"//${POSTGRES_USER}@127.0.0.1:5432/${POSTGRES_DB}"
          signing_key="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "DATABASE_URL=${db_url}" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=${db_url}" >> "$GITHUB_ENV"
          echo "E2E_TENANT_A_PASSWORD=E2e-A-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "E2E_TENANT_B_PASSWORD=E2e-B-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "E2E_FIXTURE_KEY=fixture-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "SECRET_KEY=${signing_key}" >> "$GITHUB_ENV"
      - name: Install isolated test dependencies
        run: |
          python -m pip install -r backend/requirements-dev.txt
          npm ci --no-audit
          npm --prefix frontend ci --no-audit
          npx playwright install --with-deps chromium
      - name: Rehearse current migrations and build isolated schema
        working-directory: backend
        shell: bash
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["DATABASE_URL"])
          existing = {
              "source_items": (), "crawl_jobs": ("user_id",), "scan_schedules": ("user_id",),
              "discovery_jobs": ("project_id", "created_by_user_id"), "discovered_sources": ("project_id",),
              "blocked_domains": ("project_id", "blocked_by_user_id"),
              "report_exports": ("project_id", "requested_by"),
          }
          with engine.begin() as connection:
              for table, columns in existing.items():
                  column_sql = "".join(f", {column} INTEGER" for column in columns)
                  connection.execute(text(f"CREATE TABLE {table} (id SERIAL PRIMARY KEY{column_sql})"))
              connection.execute(text("CREATE TABLE mentions (id SERIAL PRIMARY KEY, organization_id INTEGER, project_id INTEGER, keyword_id INTEGER, collected_at TIMESTAMPTZ)"))
          engine.dispose()
          PY
          python -m alembic stamp 7c2e4d6b8a91
          python -m alembic upgrade head
          test "$(python -m alembic heads | awk '{print $1}')" = "$(python -m alembic current | awk '{print $1}')"
          python -m alembic downgrade -1
          python -m alembic upgrade head
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.begin() as connection:
              connection.execute(text("DROP SCHEMA public CASCADE"))
              connection.execute(text("CREATE SCHEMA public"))
          engine.dispose()
          PY
      - name: Seed isolated tenants
        run: python tests/e2e/seed.py
      - name: Run authenticated Playwright with zero skips
        run: npm run test:e2e:auth
      - name: Redact failure artifacts
        if: failure()
        run: python tests/e2e/redact_artifacts.py
      - name: Upload redacted failure artifacts only
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: authenticated-e2e-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  secret-scan:
    name: Secret scan (new findings)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the proposed tree and its base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Create trusted scanner policy
        # Never load policy or ignore files from the proposed checkout.
        run: |
          mkdir -p "${RUNNER_TEMP}/gitleaks-policy"
          printf '[extend]\nuseDefault = true\n' > "${RUNNER_TEMP}/gitleaks-policy/trusted.toml"
          : > "${RUNNER_TEMP}/gitleaks-policy/.gitleaksignore"
      - name: Build the base-tree findings baseline
        # #218's rotated findings still exist in older commits, and one rotated
        # provider-shaped value remains in the base tree. Build the baseline
        # from this PR's immutable base SHA so only newly introduced findings
        # can pass through to the blocking scan below.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "${RUNNER_TEMP}/gitleaks-base"
          mkdir -p "${RUNNER_TEMP}/gitleaks-proposed"
          git archive "${BASE_SHA}" | tar -x -C "${RUNNER_TEMP}/gitleaks-base"
          git archive HEAD | tar -x -C "${RUNNER_TEMP}/gitleaks-proposed"
          find "${RUNNER_TEMP}/gitleaks-base" "${RUNNER_TEMP}/gitleaks-proposed" \
            \( -name .gitleaksignore -o -name .gitleaks.toml \) -delete
          docker run --rm \
            -v "${RUNNER_TEMP}/gitleaks-base:/scan:ro" \
            -v "${RUNNER_TEMP}:/scan-temp" \
            -w /scan \
            zricethezav/gitleaks@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 \
            --config=/scan-temp/gitleaks-policy/trusted.toml \
            --gitleaks-ignore-path=/scan-temp/gitleaks-policy \
            --ignore-gitleaks-allow \
            --report-format=json \
            --report-path=/scan-temp/gitleaks-baseline.json \
            --redact \
            --exit-code=0 \
            --no-banner \
            --log-level=error \
            dir .
          test -s "${RUNNER_TEMP}/gitleaks-baseline.json"
      - name: Block new secrets in the proposed snapshot
        run: >-
          docker run --rm
          -v "${{ runner.temp }}/gitleaks-proposed:/scan:ro"
          -v "${{ runner.temp }}:/scan-temp:ro"
          -w /scan
          zricethezav/gitleaks@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
          --config=/scan-temp/gitleaks-policy/trusted.toml
          --gitleaks-ignore-path=/scan-temp/gitleaks-policy
          --ignore-gitleaks-allow
          --baseline-path=/scan-temp/gitleaks-baseline.json
          --redact
          dir .
      - name: Block secrets added then deleted in PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git clone --no-local --no-checkout "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}/gitleaks-history"
          git -C "${RUNNER_TEMP}/gitleaks-history" checkout --detach "${GITHUB_SHA}"
          find "${RUNNER_TEMP}/gitleaks-history" \
            \( -name .gitleaksignore -o -name .gitleaks.toml \) -delete
          docker run --rm \
            -v "${RUNNER_TEMP}/gitleaks-history:/scan:ro" \
            -v "${RUNNER_TEMP}:/scan-temp:ro" \
            -w /scan \
            zricethezav/gitleaks@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 \
            --config=/scan-temp/gitleaks-policy/trusted.toml \
            --gitleaks-ignore-path=/scan-temp/gitleaks-policy \
            --ignore-gitleaks-allow \
            --redact \
            git \
            --log-opts="${BASE_SHA}..HEAD" \
            .
