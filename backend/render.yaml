services:
  - type: web
    name: social-listening-backend
    runtime: python
    region: singapore
    rootDir: backend
    plan: free
    numInstances: 1
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.scripts.bootstrap_production_migrations && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FREE_MVP_RUNTIME_MODE
        value: embedded
      - key: ENABLE_EMBEDDED_SCHEDULER
        value: "false"
      - key: SCHEDULER_ENABLED
        value: "false"
      - key: CELERY_EXPECTED_QUEUES
        value: analysis,crawl,notifications,reports,celery
      - key: AI_PROVIDER_CHAIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://social-listening-azure.vercel.app

  # Free MVP contract: no Celery worker or Beat services are declared. The
  # single web process runs only the explicitly selected Redis-leased embedded
  # scheduler. Web sleep/restarts reduce reliability and must remain visible.
